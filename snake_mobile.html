
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake Game</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: sans-serif;
    }
    #top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      font-size: 18px;
      z-index: 2;
    }
    #gameCanvas {
      display: block;
      background: #111;
    }
    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: none; /* hidden by default, shown on mobile */
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 2;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    button {
      width: 60px;
      height: 60px;
      font-size: 24px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      border-radius: 8px;
    }
    @media (max-width: 768px) {
      #controls { display: flex; }
    }
  </style>
</head>
<body>
  <div id="top-bar">
    <span id="score">Score: 0</span>
    <div>
      <button onclick="pauseGame()">Pause</button>
      <button onclick="restartGame()">Restart</button>
    </div>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div id="controls">
    <div class="row"><button onclick="changeDirection('UP')">⬆️</button></div>
    <div class="row">
      <button onclick="changeDirection('LEFT')">⬅️</button>
      <button onclick="changeDirection('DOWN')">⬇️</button>
      <button onclick="changeDirection('RIGHT')">➡️</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    let scoreDisplay = document.getElementById("score");

    let box = 20;
    let snake = [];
    snake[0] = { x: 9 * box, y: 10 * box };

    let food = {
      x: Math.floor(Math.random()*17+1) * box,
      y: Math.floor(Math.random()*15+3) * box
    };

    let score = 0;
    let d;
    let game;
    let paused = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    document.addEventListener("keydown", direction);
    function direction(event) {
      if(event.keyCode == 37 && d != "RIGHT") d = "LEFT";
      else if(event.keyCode == 38 && d != "DOWN") d = "UP";
      else if(event.keyCode == 39 && d != "LEFT") d = "RIGHT";
      else if(event.keyCode == 40 && d != "UP") d = "DOWN";
    }

    function changeDirection(dir) {
      if(dir == "LEFT" && d != "RIGHT") d = "LEFT";
      else if(dir == "UP" && d != "DOWN") d = "UP";
      else if(dir == "RIGHT" && d != "LEFT") d = "RIGHT";
      else if(dir == "DOWN" && d != "UP") d = "DOWN";
    }

    function draw() {
      ctx.fillStyle = "#111";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for(let i = 0; i < snake.length; i++){
        ctx.fillStyle = (i == 0) ? "lime" : "green";
        ctx.fillRect(snake[i].x, snake[i].y, box, box);
        
        ctx.strokeStyle = "black";
        ctx.strokeRect(snake[i].x, snake[i].y, box, box);
      }

      ctx.fillStyle = "red";
      ctx.fillRect(food.x, food.y, box, box);

      let snakeX = snake[0].x;
      let snakeY = snake[0].y;

      if(d == "LEFT") snakeX -= box;
      if(d == "UP") snakeY -= box;
      if(d == "RIGHT") snakeX += box;
      if(d == "DOWN") snakeY += box;

      if(snakeX == food.x && snakeY == food.y){
        score++;
        scoreDisplay.textContent = "Score: " + score;
        food = {
          x: Math.floor(Math.random()*Math.floor(canvas.width/box)) * box,
          y: Math.floor(Math.random()*Math.floor(canvas.height/box)) * box
        };
      } else {
        snake.pop();
      }

      let newHead = { x: snakeX, y: snakeY };

      if(snakeX < 0 || snakeY < 0 || snakeX >= canvas.width || snakeY >= canvas.height || collision(newHead, snake)){
        clearInterval(game);
      }

      snake.unshift(newHead);
    }

    function collision(head, array){
      for(let i = 0; i < array.length; i++){
        if(head.x == array[i].x && head.y == array[i].y){
          return true;
        }
      }
      return false;
    }

    function pauseGame(){
      if(paused){
        game = setInterval(draw, 100);
        paused = false;
      } else {
        clearInterval(game);
        paused = true;
      }
    }

    function restartGame(){
      score = 0;
      scoreDisplay.textContent = "Score: 0";
      snake = [];
      snake[0] = { x: 9 * box, y: 10 * box };
      d = null;
      food = {
        x: Math.floor(Math.random()*Math.floor(canvas.width/box)) * box,
        y: Math.floor(Math.random()*Math.floor(canvas.height/box)) * box
      };
      clearInterval(game);
      game = setInterval(draw, 100);
      paused = false;
    }

    restartGame();
  </script>
</body>
</html>
